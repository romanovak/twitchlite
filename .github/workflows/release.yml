name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PACKAGE_NAME: TwitchLite-Portable-Windows-${{ github.ref_name }}.zip
    steps:
      - name: Preserve an already published portable release
        id: published
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $exists = $false
          try {
            $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:RELEASE_REPO/releases/tags/$tag" -Headers $headers
            $names = @($release.assets.name)
            $exists = !$release.draft -and ($names -contains $env:PACKAGE_NAME)
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/checkout@v4
        if: steps.published.outputs.exists != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.published.outputs.exists != 'true'

      - name: Test and build
        if: steps.published.outputs.exists != 'true'
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked

      - name: Download the verified video runtime
        if: steps.published.outputs.exists != 'true'
        shell: pwsh
        env:
          RELEASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:RELEASE_REPO/releases/latest" -Headers $headers
          $asset = @($latest.assets | Where-Object { $_.name -like 'TwitchLite-Portable-Windows-v*.zip' })
          if ($asset.Count -ne 1) { throw 'The latest portable ZIP is missing or ambiguous' }
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile runtime.zip -MaximumRetryCount 3
          Expand-Archive -LiteralPath runtime.zip -DestinationPath runtime
          Copy-Item -LiteralPath runtime/libmpv-2.dll -Destination libmpv-2.dll
          $expected = '9197a10dd712a15d652ccb2e915f47e377605599bc9faa9a137bb8a1ef2bb6c4'
          if ((Get-FileHash libmpv-2.dll).Hash -ne $expected) { throw 'The video runtime checksum does not match' }

      - name: Package
        if: steps.published.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item target/release/twitchlite.exe -Destination portable/
          Copy-Item libmpv-2.dll -Destination portable/
          Copy-Item README.md -Destination portable/README.txt
          Copy-Item LICENSE -Destination portable/LICENSE.txt
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath portable -File).FullName -DestinationPath $env:PACKAGE_NAME

      - name: Publish TwitchLite Portable Windows
        if: steps.published.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: TwitchLite Portable Windows ${{ github.ref_name }}
          # Keep public update notes brief, general, and in English.
          body: |
            General maintenance and refinements to the Windows experience.

            Download the portable ZIP below, extract all files, and run **twitchlite.exe**. No installation is required.
          generate_release_notes: false
          files: TwitchLite-Portable-Windows-${{ github.ref_name }}.zip
