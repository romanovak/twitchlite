[package]
name = "twitchlite"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "links", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = "3.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde_json = "1"
libloading = "0.9"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4.18.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
winrt-notification = { package = "tauri-winrt-notification", version = "0.8.1" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
